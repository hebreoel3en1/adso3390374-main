<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36-transitions</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            img {
                display: block;
                margin: 2rem auto;

                &.transition1 {
                    transition: transform 0.4s ease-in;
                    &.hover {
                        transform: scale(1.3);
                    }
                }
            }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" fill="#e8e8e8" viewBox="0 0 256 256"><path d="M232,184a8,8,0,0,1-16,0A88,88,0,0,0,65.78,121.78L43.4,144H88a8,8,0,0,1,0,16H24a8,8,0,0,1-8-8V88a8,8,0,0,1,16,0v44.77l22.48-22.33A104,104,0,0,1,232,184Z"></path></svg>    </a>
    <main>
        <header class="mainmenu">
            <h1>36-transitions</h1>
            <h4>Technique controlling the speed and timing curve when changing property values smoothly between state changes (e.g., on :hover).</h4>
        </header>
        <section>
            <h4>Scale(1.3):</h4>
            <img class="transition01" src="imgs/dk.png" alt="DK">
            <h4>Rotate(-0.5turn):</h4>
            <img class="transition02" src="imgs/dk.png" alt="DK">
            <h4>RotateY(180deg):</h4>
            <img class="transition03" src="imgs/dk.png" alt="DK">
            <h4>TranslateX(80px):</h4>
            <img class="transition04" src="imgs/dk.png" alt="DK">
            <h4>Multiple:</h4>
            <div class="box"></div>
        </section>
    </main>
</body>
</html>
