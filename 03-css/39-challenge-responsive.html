<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>38-media queries - Bajoterra</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;800&display=swap');

        * {
            transition: all 0.5s ease;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a; 
            color: #fff;
            font-family: Poppins, sans-serif;
            padding: 1rem;

            main {
                border: 10px solid #39ff14; 
                padding: 1rem;
                margin: 0 auto;
                width: 1200px;

                header {
                    
                    figure.logo {
                        display: grid;
                        
                        grid-template-columns: repeat(4, 1fr); 
                        gap: 15px; /* Espacio entre ellas */
                        justify-items: center;
                        align-items: start; 
                        margin: 0 auto 2rem auto;
                        padding: 0;
                        width: 100%;
                        max-width: 1000px; 
                        
                        
                        .card-personaje {
                            margin: 0;
                            text-align: center;
                            width: 100%;

                            img {
                                width: 100%;
                                max-width: 220px; 
                                height: 220px;
                                object-fit: contain; 
                                border: 3px solid transparent;
                                border-radius: 10px;
                                cursor: pointer;

                                &:hover {
                                    transform: scale(1.1);
                                    border-color: #39ff14;
                                    box-shadow: 0 0 15px #39ff14;
                                }
                            }

                            /* Descripción de cada imagen */
                            figcaption {
                                margin-top: 5px; 
                                font-size: 1.2rem;
                                font-weight: 800;
                                color: #39ff14;
                                text-shadow: 0 0 5px #39ff14;
                            }
                        }
                    }
                    menu {
                        padding: 0;
                        text-align: center;
                        a:is(:link, :visited) {
                            background-color: #39ff14;
                            color: #0a0a0a;
                            font-size: 1.2rem;
                            font-weight: 800;
                            text-decoration: none;
                            text-align: center;
                            padding: 0.4rem 0.8rem;
                            display: inline-block;
                            width: 204px;
                            transition: all 0.5s ease;
                            &:hover {
                                background: linear-gradient(#0a0a0a 92%, #39ff14 92%);
                                color: #39ff14;
                                transform: translateY(-8px) scale(1.02);
                            }
                        }
                    }
                }
                section {
                    h2 {
                        text-align: center; 
                        font-size: 2.8rem;
                        font-weight: 800;
                        color: #39ff14;
                        text-shadow: 0 0 10px #39ff14;
                    }
                    h2:nth-of-type(2) { display: none; }
                    h2:last-of-type { display: none; }
                    p {
                        text-align: justify;
                        line-height: 1.8rem;
                    }   
                }
            }
        }

        /* Breakpoint: 1280px (Tablet) */
        @media (max-width: 1280px) {
            body {
                main {
                    width: 800px;

                    header {
                        figure.logo {
                            
                            grid-template-columns: repeat(2, 1fr);
                            max-width: 600px; 
                            
                            .card-personaje img {
                                max-width: 200px;
                                height: 200px;
                            }
                        }
                        menu {
                            a:is(:link, :visited) {
                                width: 124px;
                            }
                        }
                    }
                    section {
                        h2:first-of-type { display: none; }
                        h2:nth-of-type(2) { display: block; }
                    }
                }
            }
        }
        
        /* Breakpoint: < 800px (Mobile) */
        @media (max-width: 800px) {
            body {
                main {
                    width: 100%;
                    max-width: 380px;

                    header {
                        figure.logo {
                            
                            grid-template-columns: 1fr;
                            gap: 15px;
                            max-width: 100%;

                            .card-personaje img {
                                max-width: 150px;
                                height: 150px;
                            }
                        }
                        menu {
                            a:is(:link, :visited) {
                                display: block;
                                width: 100%;
                                margin-bottom: 0.2rem;
                            }
                        }
                    }
                    section {
                        h2:nth-of-type(2) { display: none; }
                        h2:last-of-type {
                            font-size: 2rem;
                            display: block;
                        }
                    }
                }
            }
        }
    </style>
</head>

<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>
    <main>
        <header>
            <!-- Las 4 imágenes con sus descripciones -->
            <figure class="logo">
                
                <figure class="card-personaje">
                    <img src="imgs/images.jpg" alt="Ben 10">
                    <figcaption>Verpi</figcaption>
                </figure>

                <figure class="card-personaje">
                    <img src="imgs/ilai.png" alt="Heatblast">
                    <figcaption>Ilai</figcaption>
                </figure>

                <figure class="card-personaje">
                    <img src="imgs/darkstar.png" alt="Darkstar">
                    <figcaption>Doctor Black</figcaption>
                </figure>

                <figure class="card-personaje">
                    <img src="imgs/cd2617a93a9ac5b8c01acbf8d906457c.jpg" alt="Zombozo">
                    <figcaption>Amperling</figcaption>
                </figure>

            </figure>
            
            <menu>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Products</a>
                <a href="#">Contact</a>
            </menu>
        </header>
        <section>
            <h2>Desktop: (> 1280px)</h2>
            <h2>Tablet: (> 800px)</h2>
            <h2>Mobile: (< 800px)</h2>
            
            <p>
                Practical exercise building a responsive webpage layout that adapts smoothly across mobile, tablet, and desktop viewports.
            </p>
        </section>

    </main>
</body>

</html>
